min_version = "2026.5.15"

[settings]
experimental = true
lockfile = true
minimum_release_age = "7d"

[tools]
node = "26"
pnpm = "12"
dagger = "0.21.9"
actionlint = "1.7.12"
shellcheck = "0.11.0"
"github:zizmorcore/zizmor" = "v1.30.1"

[tasks."hister:up"]
description = "Start a local Hister daemon on localhost:4433 via Docker"
run = """
docker rm -f hister-dev 2>/dev/null || true
mkdir -p dev-data
docker run -d --name hister-dev \
  -p 4433:4433 \
  -e HISTER__SERVER__ADDRESS=0.0.0.0:4433 \
  -v "$PWD/dev-data:/hister/data" \
  ghcr.io/asciimoo/hister:latest
echo "Hister running at http://localhost:4433"
"""

[tasks."hister:down"]
description = "Stop the local Hister daemon"
run = "docker rm -f hister-dev"

[tasks."hister:logs"]
description = "Follow local Hister logs"
run = "docker logs -f hister-dev"

[tasks."tabstash:install"]
description = "Install dependencies in ../tab-stash"
run = "pnpm -C ../tab-stash install --no-lockfile"

[tasks."tabstash:build"]
description = "Build the Tab Stash extension in ../tab-stash"
run = "make -C ../tab-stash build-dbg"

[tasks."bridge:install"]
description = "Install bridge dependencies"
run = "pnpm install"

[tasks."bridge:build"]
description = "Bundle bridge extension with tsup (alias of `build`)"
depends = ["build"]

[tasks."test"]
description = "Run bridge tests with Vitest"
run = "pnpm test"

[tasks."dev:firefox"]
description = "Launch isolated browser running Tab Stash and the Bridge"
depends = ["bridge:build"]
run = """
if [ -n "$FIREFOX_BINARY" ] && [ -x "$FIREFOX_BINARY" ]; then
  BROWSER_BIN="$FIREFOX_BINARY"
elif [ -x "/Applications/Zen.app/Contents/MacOS/zen" ]; then
  BROWSER_BIN="/Applications/Zen.app/Contents/MacOS/zen"
elif [ -x "/Applications/Firefox Developer Edition.app/Contents/MacOS/firefox" ]; then
  BROWSER_BIN="/Applications/Firefox Developer Edition.app/Contents/MacOS/firefox"
elif [ -x "/Applications/Firefox.app/Contents/MacOS/firefox" ]; then
  BROWSER_BIN="/Applications/Firefox.app/Contents/MacOS/firefox"
elif command -v zen >/dev/null 2>&1; then
  BROWSER_BIN="$(command -v zen)"
elif command -v firefox >/dev/null 2>&1; then
  BROWSER_BIN="$(command -v firefox)"
else
  echo "Error: No Firefox-compatible binary found (checked Zen, Firefox, and PATH)." >&2
  exit 1
fi

echo "Launching browser: $BROWSER_BIN"
pnpx web-ext run \
  --source-dir . \
  --firefox-binary "$BROWSER_BIN" \
  --firefox-profile ./dev-profile \
  --profile-create-if-missing \
  --keep-profile-changes \
  --watch-file dist/background.js \
  --watch-file dist/options.js \
  --watch-file manifest.json \
  --watch-ignored "dev-profile/**" \
  --watch-ignored "dev-data/**" \
  --watch-ignored "node_modules/**" \
  --start-url "about:debugging#/runtime/this-firefox"
"""

[tasks."dev"]
description = "Start the complete local development ecosystem"
depends = ["hister:up", "bridge:build"]
run = """
echo "=== Dev Environment Ready ==="
echo "1. Hister running at: http://localhost:4433"
echo "2. Bridge bundled in ./dist"
echo "To launch Firefox with the bridge: mise run dev:firefox"
"""

# ---------------------------------------------------------------------------
# Quality gates
# ---------------------------------------------------------------------------

[tasks.format]
alias = "fmt"
description = "Format the repository with Prettier (write in place)"
run = "pnpm run format"

[tasks.format-check]
alias = "fmtcheck"
description = "Check Prettier formatting without writing"
run = "pnpm run format:check"

[tasks."lint:oxlint"]
description = "Lint source files with oxlint (type-aware)"
run = "pnpm run lint"

[tasks."lint:fix"]
description = "Auto-fix oxlint findings"
run = "pnpm run lint:fix"

[tasks.check]
description = "Type-check the extension with tsc"
run = "pnpm run typecheck"

[tasks.typecheck]
description = "Type-check the extension (alias of `check`)"
depends = ["check"]

[tasks.fix]
description = "Auto-format + auto-fix lint findings"
run = """
mise run format
mise run lint:fix
echo 'Auto-fix complete. Run `mise run check` to verify types.'
"""

# Static checks only (no tests, no build).
[tasks.lint]
description = "Run all static checks (format + oxlint + types)"
run = """
mise run format-check
mise run lint:oxlint
mise run check
echo 'All lint checks passed.'
"""

# All quality gates: static checks + unit tests. The pre-push / pre-PR gate.
[tasks.verify]
description = "Run all quality gates (static checks + unit tests)"
run = """
mise run lint
mise run test
echo 'All quality gates passed.'
"""

[tasks.build]
description = "Bundle the extension with tsup"
run = "pnpm run build"

# ---------------------------------------------------------------------------
# Audit
# ---------------------------------------------------------------------------

[tasks."audit:prod"]
description = "Audit production dependencies for known vulnerabilities"
run = "pnpm audit --prod --audit-level high --ignore-registry-errors"

[tasks."audit:all"]
description = "Audit all dependencies for known vulnerabilities"
run = "pnpm audit --audit-level high --ignore-registry-errors"

[tasks."audit:signatures"]
description = "Verify registry signatures for installed packages"
run = "pnpm audit signatures"

# ---------------------------------------------------------------------------
# CI
# ---------------------------------------------------------------------------

[tasks.ci]
description = "Run the local CI pipeline (quality + audit + build)"
run = """
mise run verify
mise run audit:all
mise run audit:signatures
mise run build
echo 'tab-hister-bridge checks completed successfully.'
"""

[tasks."ci:dagger"]
description = "Run the same containerized checks used by GitHub Actions"
run = "mise exec -- dagger call -m ci check --source=."

[tasks."ci:package"]
description = "Build the extension zip with web-ext inside Dagger"
run = "mise exec -- dagger call -m ci package --source=. export --path=web-ext-artifacts/tab-hister-bridge.zip"

[tasks."actions:lint"]
description = "Lint GitHub Actions workflows"
run = "actionlint .github/workflows/*.yml"

[tasks."actions:audit"]
description = "Audit GitHub Actions workflows with strict zizmor settings"
run = "zizmor --pedantic --no-ignores .github/workflows"
