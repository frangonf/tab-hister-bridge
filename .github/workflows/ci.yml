name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflow-policy:
    name: Workflow policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # checkout reads repository workflows and the mise lockfile
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install: false
          cache: true

      - name: Install workflow tools
        run: mise install --locked actionlint github:zizmorcore/zizmor shellcheck

      - name: Lint workflows
        run: mise run actions:lint

      - name: Audit workflows
        run: mise run actions:audit

  project:
    name: Project checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read # checkout supplies the source tree to Dagger
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Dagger checks
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: "v0.21.9"
          module: "ci"
          call: check --source=.

  package:
    name: Package extension
    needs: project
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read # checkout supplies the source tree to Dagger
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build extension zip
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: "v0.21.9"
          module: "ci"
          call: package --source=. export --path=web-ext-artifacts/tab-hister-bridge.zip

      - name: Upload extension artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tab-hister-bridge
          path: web-ext-artifacts/tab-hister-bridge.zip
          if-no-files-found: error
